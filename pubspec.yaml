name: pocket_guard
description: "Pay Vault is your sleek financial companion, empowering you to effortlessly manage expenses, track investments, and gain insightful financial clarity, all within a beautifully designed, secure environment."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.2
  go_router: ^16.2.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.1.0
  flutter_riverpod: ^3.0.0
  shared_preferences: ^2.0.0
  intl: ^0.19.0
  fl_chart: 0.68.0
  candlesticks: ^3.0.0
  speech_to_text: ^7.4.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/dreamflow_icon.jpg
  remove_alpha_ios: true
